<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleanos Nicole</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           CONFIGURACION DE COLORES - Paleta Kuromi
           Cambia estos valores para modificar colores
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0015;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* ============================================
           PANTALLA DE CAJA DE REGALO (INICIO)
           ============================================ */
        .gift-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .gift-screen.hidden {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .gift-box-container {
            position: relative;
            cursor: pointer;
            animation: giftFloat 3s ease-in-out infinite;
        }

        @keyframes giftFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .gift-box {
            width: 200px;
            height: 180px;
            position: relative;
        }

        .gift-base {
            width: 200px;
            height: 140px;
            background: linear-gradient(135deg, #9b59b6, #6b3fa0);
            border-radius: 10px;
            position: absolute;
            bottom: 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .gift-base::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 100%;
            background: linear-gradient(135deg, #ff69b4, #ffb6c1);
        }

        .gift-lid {
            width: 220px;
            height: 50px;
            background: linear-gradient(135deg, #ba55d3, #9b59b6);
            border-radius: 8px;
            position: absolute;
            top: 0;
            left: -10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            transition: transform 0.6s ease;
        }

        .gift-lid::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 100%;
            background: linear-gradient(135deg, #ff69b4, #ffb6c1);
        }

        .gift-bow {
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
        }

        .bow-center {
            width: 30px;
            height: 30px;
            background: #ff69b4;
            border-radius: 50%;
            position: relative;
            z-index: 2;
        }

        .bow-left, .bow-right {
            width: 50px;
            height: 35px;
            background: #ff69b4;
            border-radius: 50% 50% 50% 50%;
            position: absolute;
            top: 5px;
        }

        .bow-left {
            left: -35px;
            transform: rotate(-20deg);
        }

        .bow-right {
            right: -35px;
            transform: rotate(20deg);
        }

        .gift-box-container:hover .gift-lid {
            transform: translateY(-20px) rotate(-5deg);
        }

        .gift-text {
            margin-top: 30px;
            font-size: 1.5rem;
            color: #ffb6c1;
            text-shadow: 0 0 10px #ff69b4;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.05); }
        }

        .gift-hint {
            margin-top: 15px;
            font-size: 1rem;
            color: rgba(255,255,255,0.6);
        }

        .gift-stars {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .gift-star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }

        /* ============================================
           FONDO DE GALAXIA
           ============================================ */
        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .galaxy-layer {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
        }

        .nebula-1 {
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(138, 43, 226, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(75, 0, 130, 0.3) 0%, transparent 40%),
                radial-gradient(ellipse at 60% 70%, rgba(255, 20, 147, 0.2) 0%, transparent 45%);
            animation: nebulaMove1 60s ease-in-out infinite;
        }

        .nebula-2 {
            background: 
                radial-gradient(ellipse at 70% 60%, rgba(148, 0, 211, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 80%, rgba(186, 85, 211, 0.25) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 20%, rgba(255, 105, 180, 0.2) 0%, transparent 40%);
            animation: nebulaMove2 45s ease-in-out infinite;
        }

        .nebula-3 {
            background: 
                radial-gradient(ellipse at 40% 50%, rgba(128, 0, 128, 0.2) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 40%, rgba(199, 21, 133, 0.15) 0%, transparent 40%);
            animation: nebulaMove3 50s ease-in-out infinite;
        }

        @keyframes nebulaMove1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 3%) rotate(2deg); }
            50% { transform: translate(2%, -3%) rotate(-1deg); }
            75% { transform: translate(-3%, 2%) rotate(1deg); }
        }

        @keyframes nebulaMove2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-4%, 4%) rotate(-2deg); }
            66% { transform: translate(3%, -2%) rotate(1deg); }
        }

        @keyframes nebulaMove3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(2%, 2%) scale(1.05); }
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .star.twinkle {
            animation: twinkle 3s ease-in-out infinite;
        }

        .star.moving {
            animation: starMove linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        @keyframes starMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 30px); }
        }

        .galaxy-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 0, 21, 0.4) 70%, rgba(10, 0, 21, 0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        /* ============================================
           EMOJIS FLOTANTES
           ============================================ */
        .floating-emojis {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .emoji {
            position: absolute;
            font-size: 1.8rem;
            animation: floatEmoji 6s ease-in-out infinite;
            opacity: 0.7;
        }

        @keyframes floatEmoji {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-15px) rotate(5deg); }
            75% { transform: translateY(15px) rotate(-5deg); }
        }

        /* ============================================
           GLOBOS
           ============================================ */
        .balloons-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
        }

        .balloon {
            position: absolute;
            width: 50px;
            height: 65px;
            border-radius: 50% 50% 50% 50%;
            animation: riseBalloon linear infinite;
            opacity: 0.85;
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -55px;
            left: 50%;
            transform: translateX(-50%);
            width: 1px;
            height: 50px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.5), rgba(255,255,255,0.1));
        }

        .balloon.purple { background: linear-gradient(135deg, #9b59b6, #6b3fa0); }
        .balloon.purple::before { border-top: 10px solid #6b3fa0; }
        .balloon.black { background: linear-gradient(135deg, #3a3a3a, #1a1a1a); }
        .balloon.black::before { border-top: 10px solid #1a1a1a; }
        .balloon.white { background: linear-gradient(135deg, #fff, #ddd); }
        .balloon.white::before { border-top: 10px solid #ddd; }
        .balloon.pink { background: linear-gradient(135deg, #ffb6c1, #ff69b4); }
        .balloon.pink::before { border-top: 10px solid #ff69b4; }

        @keyframes riseBalloon {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.85; }
            90% { opacity: 0.85; }
            100% { transform: translateY(-150px) rotate(20deg); opacity: 0; }
        }

        /* ============================================
           CONTENIDO PRINCIPAL
           ============================================ */
        .main-content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            padding-top: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        .main-content.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* ============================================
           TITULO
           ============================================ */
        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            color: #fff;
            text-shadow: 
                0 0 10px #ff69b4,
                0 0 20px #ff69b4,
                0 0 30px #ff69b4;
            margin-bottom: 5px;
            text-align: center;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .title-sub {
            font-family: 'Dancing Script', cursive;
            font-size: 2.5rem;
            color: #ffb6c1;
            text-shadow: 0 0 15px #ff69b4;
            margin-bottom: 20px;
            text-align: center;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4; }
            to { text-shadow: 0 0 20px #ff69b4, 0 0 30px #9b59b6, 0 0 40px #9b59b6; }
        }

        /* ============================================
           PASTEL DE CUMPLEANOS
           Cambia --cake-speed para velocidad de animacion
           ============================================ */
        .cake-container {
            position: relative;
            width: 280px;
            height: 340px;
            margin: 10px auto;
        }

        .cake-part {
            position: absolute;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.6s ease-out;
        }

        .cake-part.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Base del pastel - Piso 1 */
        .cake-base {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            width: 220px;
            height: 80px;
            background: linear-gradient(180deg, #9b59b6 0%, #6b3fa0 100%);
            border-radius: 10px 10px 20px 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .cake-base.visible {
            transform: translateX(-50%) translateY(0);
        }

        .cake-base::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 0;
            width: 100%;
            height: 25px;
            background: linear-gradient(180deg, #ffb6c1 0%, #ff69b4 100%);
            border-radius: 50% 50% 0 0;
        }

        /* Piso 2 */
        .cake-middle {
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            width: 170px;
            height: 70px;
            background: linear-gradient(180deg, #2d2d2d 0%, #1a1a1a 100%);
            border-radius: 10px 10px 15px 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .cake-middle.visible {
            transform: translateX(-50%) translateY(0);
        }

        .cake-middle::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 0;
            width: 100%;
            height: 20px;
            background: linear-gradient(180deg, #ba55d3 0%, #9b59b6 100%);
            border-radius: 50% 50% 0 0;
        }

        /* Decoraciones */
        .cake-decor {
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            width: 170px;
            height: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .cake-decor.visible {
            transform: translateX(-50%) translateY(0);
        }

        .decor-item {
            font-size: 1.2rem;
        }

        /* Velas con numeros 2 y 0 */
        .candles-container {
            bottom: 175px;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            display: flex;
            gap: 20px;
        }

        .candles-container.visible {
            transform: translateX(-50%) translateY(0);
        }

        .candle {
            position: relative;
            width: 35px;
            height: 55px;
            background: linear-gradient(135deg, #ff69b4, #ffb6c1);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: bold;
            color: #1a1a1a;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        .candle::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 10px;
            background: #1a1a1a;
            border-radius: 2px;
        }

        .flame {
            position: absolute;
            top: -28px;
            left: 50%;
            transform: translateX(-50%);
            width: 12px;
            height: 20px;
            background: linear-gradient(to top, #ff6600, #ffcc00, #fff);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.3s ease-in-out infinite alternate;
        }

        @keyframes flicker {
            0% { transform: translateX(-50%) scale(1) rotate(-2deg); opacity: 1; }
            100% { transform: translateX(-50%) scale(1.1) rotate(2deg); opacity: 0.9; }
        }

        /* ============================================
           KUROMI
           ============================================ */
        .kuromi-container {
            bottom: 230px;
            left: 50%;
            transform: translateX(-50%) translateY(30px) scale(0);
            width: 130px;
            height: 150px;
        }

        .kuromi-container.visible {
            transform: translateX(-50%) translateY(0) scale(1);
            animation: kuromiJump 2s ease-in-out infinite;
        }

        @keyframes kuromiJump {
            0%, 100% { transform: translateX(-50%) translateY(0) scale(1); }
            50% { transform: translateX(-50%) translateY(-10px) scale(1.02); }
        }

        .kuromi {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* Cabeza/Capucha */
        .kuromi-head {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 85px;
            background: #3a3a3a;
            border-radius: 50% 50% 45% 45%;
            border: 3px solid #1a1a1a;
        }

        /* Cara */
        .kuromi-face {
            position: absolute;
            bottom: 5px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 58px;
            background: #fff;
            border-radius: 50% 50% 45% 45%;
            border: 2px solid #1a1a1a;
        }

        /* Ojos */
        .kuromi-eye {
            position: absolute;
            width: 12px;
            height: 14px;
            background: #1a1a1a;
            border-radius: 50%;
            top: 18px;
        }

        .kuromi-eye.left { left: 14px; }
        .kuromi-eye.right { right: 14px; }

        .kuromi-eye-shine {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            top: 3px;
            left: 2px;
        }

        /* Pestanas */
        .kuromi-lash {
            position: absolute;
            width: 3px;
            height: 6px;
            background: #1a1a1a;
            top: -4px;
        }

        .kuromi-eye.left .kuromi-lash { left: 0; transform: rotate(-20deg); }
        .kuromi-eye.right .kuromi-lash { right: 0; transform: rotate(20deg); }

        /* Nariz */
        .kuromi-nose {
            position: absolute;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 6px;
            background: #ffb6c1;
            border-radius: 50%;
        }

        /* Sonrisa */
        .kuromi-mouth {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: 18px;
            height: 8px;
            border: 2px solid #1a1a1a;
            border-top: none;
            border-radius: 0 0 15px 15px;
        }

        /* Mejillas */
        .kuromi-blush {
            position: absolute;
            width: 10px;
            height: 6px;
            background: #ffb6c1;
            border-radius: 50%;
            top: 32px;
        }

        .kuromi-blush.left { left: 5px; }
        .kuromi-blush.right { right: 5px; }

        /* Orejas triangulares con puntas */
        .kuromi-ear {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-bottom: 55px solid #3a3a3a;
            top: -45px;
        }

        .kuromi-ear::before {
            content: '';
            position: absolute;
            top: 8px;
            left: -10px;
            width: 0;
            height: 0;
            border-left: 10px solid transparent;
            border-right: 10px solid transparent;
            border-bottom: 35px solid #ffb6c1;
        }

        .kuromi-ear.left {
            left: 8px;
            transform: rotate(-10deg);
        }

        .kuromi-ear.right {
            right: 8px;
            transform: rotate(10deg);
        }

        /* Bolitas en las puntas de las orejas */
        .kuromi-ear-ball {
            position: absolute;
            width: 14px;
            height: 14px;
            background: #4a4a4a;
            border-radius: 50%;
            border: 2px solid #1a1a1a;
        }

        .kuromi-ear.left .kuromi-ear-ball {
            top: -60px;
            left: 12px;
        }

        .kuromi-ear.right .kuromi-ear-ball {
            top: -60px;
            right: 12px;
        }

        /* Calavera rosa en la frente */
        .kuromi-skull {
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 28px;
            background: #ffb6c1;
            border-radius: 50% 50% 45% 45%;
            z-index: 5;
        }

        .skull-eye {
            position: absolute;
            width: 6px;
            height: 7px;
            background: #3a3a3a;
            border-radius: 50% 50% 50% 50%;
            top: 10px;
        }

        .skull-eye.left { left: 6px; }
        .skull-eye.right { right: 6px; }

        .skull-nose {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-top: 5px solid #3a3a3a;
        }

        /* ============================================
           BOTON Y FRASES
           ============================================ */
        .interaction-area {
            margin-top: 20px;
            text-align: center;
            width: 100%;
            max-width: 500px;
        }

        .phrase-box {
            background: rgba(26, 10, 46, 0.85);
            border: 2px solid #9b59b6;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(155, 89, 182, 0.3);
        }

        .phrase-text {
            font-size: 1.1rem;
            color: #fff;
            line-height: 1.5;
            text-align: center;
        }

        .surprise-btn {
            background: linear-gradient(135deg, #9b59b6, #6b3fa0);
            color: white;
            border: none;
            padding: 16px 35px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(155, 89, 182, 0.4);
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .surprise-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(155, 89, 182, 0.5);
        }

        .surprise-btn:active {
            transform: scale(0.95);
        }

        .footer {
            margin-top: 20px;
            color: rgba(255,255,255,0.5);
            font-size: 0.85rem;
        }

        /* ============================================
           RESPONSIVE
           ============================================ */
        @media (max-width: 600px) {
            .title {
                font-size: 1.9rem;
            }
            .title-sub {
                font-size: 1.7rem;
            }
            .cake-container {
                transform: scale(0.8);
                margin: -20px auto;
            }
            .phrase-box {
                padding: 15px;
                margin: 0 10px 15px 10px;
            }
            .phrase-text {
                font-size: 0.95rem;
            }
            .surprise-btn {
                padding: 14px 28px;
                font-size: 1rem;
            }
            .gift-box {
                transform: scale(0.8);
            }
            .gift-text {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- ============================================
         PANTALLA DE CAJA DE REGALO
         ============================================ -->
    <div class="gift-screen" id="giftScreen" onclick="openGift()">
        <div class="gift-stars" id="giftStars"></div>
        <div class="gift-box-container">
            <div class="gift-box">
                <div class="gift-lid"></div>
                <div class="gift-base"></div>
                <div class="gift-bow">
                    <div class="bow-left"></div>
                    <div class="bow-right"></div>
                    <div class="bow-center"></div>
                </div>
            </div>
        </div>
        <div class="gift-text">&#x1F381; Toca para abrir &#x1F381;</div>
        <div class="gift-hint">Un regalo especial te espera...</div>
    </div>

    <!-- ============================================
         FONDO DE GALAXIA
         ============================================ -->
    <div class="galaxy-bg">
        <div class="galaxy-layer nebula-1"></div>
        <div class="galaxy-layer nebula-2"></div>
        <div class="galaxy-layer nebula-3"></div>
    </div>
    <div class="stars-container" id="stars"></div>
    <div class="galaxy-overlay"></div>

    <!-- ============================================
         EMOJIS Y GLOBOS
         ============================================ -->
    <div class="floating-emojis" id="emojis"></div>
    <div class="balloons-container" id="balloons"></div>

    <!-- ============================================
         CONTENIDO PRINCIPAL
         ============================================ -->
    <div class="main-content" id="mainContent">
        <h1 class="title">&#x2728; Kuromi Te Desea Un Feliz Cumpleanos &#x2728;</h1>
        <h2 class="title-sub">&#x1F380; Nicole &#x1F380;</h2>

        <!-- Pastel -->
        <div class="cake-container">
            <!-- Kuromi encima del pastel -->
            <div class="cake-part kuromi-container" id="kuromi">
                <div class="kuromi">
                    <div class="kuromi-head">
                        <div class="kuromi-ear left"><div class="kuromi-ear-ball"></div></div>
                        <div class="kuromi-ear right"><div class="kuromi-ear-ball"></div></div>
                        <div class="kuromi-skull">
                            <div class="skull-eye left"></div>
                            <div class="skull-eye right"></div>
                            <div class="skull-nose"></div>
                        </div>
                        <div class="kuromi-face">
                            <div class="kuromi-eye left"><div class="kuromi-eye-shine"></div><div class="kuromi-lash"></div></div>
                            <div class="kuromi-eye right"><div class="kuromi-eye-shine"></div><div class="kuromi-lash"></div></div>
                            <div class="kuromi-blush left"></div>
                            <div class="kuromi-blush right"></div>
                            <div class="kuromi-nose"></div>
                            <div class="kuromi-mouth"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Velas con 20 -->
            <div class="cake-part candles-container" id="candles">
                <div class="candle">
                    <span>2</span>
                    <div class="flame"></div>
                </div>
                <div class="candle">
                    <span>0</span>
                    <div class="flame"></div>
                </div>
            </div>

            <!-- Decoraciones -->
            <div class="cake-part cake-decor" id="decor">
                <span class="decor-item">&#x1F480;</span>
                <span class="decor-item">&#x1F5A4;</span>
                <span class="decor-item">&#x1F319;</span>
                <span class="decor-item">&#x1F380;</span>
                <span class="decor-item">&#x1F480;</span>
            </div>

            <!-- Piso 2 -->
            <div class="cake-part cake-middle" id="middle"></div>

            <!-- Base -->
            <div class="cake-part cake-base" id="base"></div>
        </div>

        <!-- Area de interaccion -->
        <div class="interaction-area">
            <div class="phrase-box">
                <p class="phrase-text" id="phraseText">&#x1F389; Presiona el boton para ver mensajes &#x1F382;</p>
            </div>
            <button class="surprise-btn" onclick="showPhrase()">&#x1F389; PRESIONAME &#x1F382;</button>
        </div>

        <div class="footer">Hecho con amor para Nicole &#x1F49C;</div>
    </div>

    <script>
        /* ============================================
           CONFIGURACION DE FRASES
           Modifica este array para cambiar las frases
           ============================================ */
        var frases = [
            "Feliz cumpleanos, Nicole. Espero que este ciclo compile sin errores.",
            "Programar es bien dificil. Te respeto por hacerlo.",
            "No te odio. No guardo rencor. Solo quiero que tu vida tenga mas true que false.",
            "Espero que logres debuguear esas heridas que no te dejan ejecutar en paz.",
            "Si te preguntas por que hice esto: queria dejar un commit bonito en tu historial. Espero no haberlo roto.",
            "Eres inteligente y capaz. Cuando tu self-confidence este en null, recuerda: yo tengo fe en tu algoritmo.",
            "Eres inteligente y capaz. Tu mejor feature eres tu. Cuando el sistema falle, recuerda: yo no tengo bugs en mi fe por ti.",
            "Se que conmigo diste try-catch repetidos. No dejes de intentarlo en lo que sigue.",
            "No se si tu codigo tiene errores de sintaxis o logica. Solo se que necesitas debuguearte sola. Y se que lo lograras.",
            "No te juzgo. No te critico. Solo te paso un console.log(\"creo en ti, se que puedes\").",
            "Quiero que Nomar y tu sean felices, el en serio me agrada.",
            "Espero que consigas tu vaca color vaca.",
            "No se si esto es un break o un continue. El runtime lo dira.",
            "No te odio. El perdon es una funcion asincrona. No se resuelve de inmediato.",
            "Te quiero, pero rogar no es querer. Y quiero que ambos seamos felices.",
            "Tu logica para resolver conflictos es compleja. Tal vez necesite un refactor. A veces actualizar el codigo ayuda a que todo funcione mejor.",
            "Tu forma de manejar problemas es como un script heredado. Funciona, pero con legacy bugs. Un buen update emocional te haria mas feliz.",
            "Resuelves conflictos como si tuvieras callback hell. Depurar eso te ayudaria a vivir con menos errors y mas success."
        ];

        var giftOpened = false;

        /* Crear estrellas para pantalla de regalo */
        function createGiftStars() {
            var container = document.getElementById("giftStars");
            for (var i = 0; i < 50; i++) {
                var star = document.createElement("div");
                star.className = "gift-star";
                star.style.left = (Math.random() * 100) + "%";
                star.style.top = (Math.random() * 100) + "%";
                var size = (Math.random() * 3 + 1) + "px";
                star.style.width = size;
                star.style.height = size;
                star.style.animationDelay = (Math.random() * 3) + "s";
                container.appendChild(star);
            }
        }

        /* Abrir la caja de regalo */
        function openGift() {
            if (giftOpened) return;
            giftOpened = true;

            var giftScreen = document.getElementById("giftScreen");
            giftScreen.classList.add("hidden");

            setTimeout(function() {
                var mainContent = document.getElementById("mainContent");
                mainContent.classList.add("visible");
                animateCake();
            }, 800);
        }

        /* Animacion del pastel construyendose */
        function animateCake() {
            var parts = ["base", "middle", "decor", "candles", "kuromi"];
            var delay = 0;
            
            for (var i = 0; i < parts.length; i++) {
                (function(index) {
                    setTimeout(function() {
                        var part = document.getElementById(parts[index]);
                        if (part) {
                            part.classList.add("visible");
                        }
                    }, delay);
                })(i);
                delay += 500; /* Tiempo entre cada parte - Cambia este valor */
            }
        }

        /* Mostrar frase aleatoria */
        function showPhrase() {
            var phraseText = document.getElementById("phraseText");
            var randomIndex = Math.floor(Math.random() * frases.length);
            phraseText.textContent = frases[randomIndex];
        }

        /* Crear estrellas */
        function createStars() {
            var container = document.getElementById("stars");
            
            for (var i = 0; i < 80; i++) {
                var star = document.createElement("div");
                star.className = "star twinkle";
                star.style.left = (Math.random() * 100) + "%";
                star.style.top = (Math.random() * 100) + "%";
                var size = (Math.random() * 2.5 + 0.5) + "px";
                star.style.width = size;
                star.style.height = size;
                star.style.animationDelay = (Math.random() * 3) + "s";
                star.style.animationDuration = (Math.random() * 2 + 2) + "s";
                container.appendChild(star);
            }
            
            for (var j = 0; j < 30; j++) {
                var movingStar = document.createElement("div");
                movingStar.className = "star moving";
                movingStar.style.left = (Math.random() * 100) + "%";
                movingStar.style.top = (Math.random() * 100) + "%";
                var moveSize = (Math.random() * 2 + 1) + "px";
                movingStar.style.width = moveSize;
                movingStar.style.height = moveSize;
                movingStar.style.opacity = (Math.random() * 0.5 + 0.3);
                movingStar.style.animationDuration = (Math.random() * 20 + 30) + "s";
                container.appendChild(movingStar);
            }
        }

        /* Crear emojis flotantes */
        function createEmojis() {
            var container = document.getElementById("emojis");
            var emojis = ["\u{1F480}", "\u{1F5A4}", "\u{1F319}", "\u{1F380}", "\u{1F31F}", "\u{1F987}", "\u{1F578}", "\u{1F49C}", "\u{2728}", "\u{1F381}", "\u{1F382}"];
            var positions = [
                { left: "3%", top: "10%" },
                { left: "93%", top: "15%" },
                { left: "8%", top: "70%" },
                { left: "88%", top: "75%" },
                { left: "5%", top: "40%" },
                { left: "92%", top: "45%" },
                { left: "15%", top: "85%" },
                { left: "85%", top: "88%" },
                { left: "50%", top: "5%" },
                { left: "25%", top: "20%" },
                { left: "75%", top: "25%" },
                { left: "10%", top: "55%" },
                { left: "90%", top: "60%" }
            ];
            
            for (var i = 0; i < positions.length; i++) {
                var emoji = document.createElement("div");
                emoji.className = "emoji";
                emoji.textContent = emojis[i % emojis.length];
                emoji.style.left = positions[i].left;
                emoji.style.top = positions[i].top;
                emoji.style.animationDelay = (i * 0.4) + "s";
                container.appendChild(emoji);
            }
        }

        /* Crear globos */
        function createBalloon() {
            var container = document.getElementById("balloons");
            var colors = ["purple", "black", "white", "pink"];
            
            var balloon = document.createElement("div");
            balloon.className = "balloon " + colors[Math.floor(Math.random() * colors.length)];
            balloon.style.left = (Math.random() * 90 + 5) + "%";
            balloon.style.animationDuration = (Math.random() * 5 + 8) + "s";
            
            container.appendChild(balloon);
            
            setTimeout(function() {
                if (balloon.parentNode) {
                    balloon.parentNode.removeChild(balloon);
                }
            }, 15000);
        }

        /* Inicializar */
        createGiftStars();
        createStars();
        createEmojis();

        for (var i = 0; i < 10; i++) {
            (function(index) {
                setTimeout(function() {
                    createBalloon();
                }, index * 400);
            })(i);
        }
        
        setInterval(createBalloon, 1000);
    </script>
</body>
</html>
