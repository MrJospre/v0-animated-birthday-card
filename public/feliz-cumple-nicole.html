<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Cumpleanos Nicole</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0a0015;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        .galaxy-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .galaxy-layer {
            position: absolute;
            width: 200%;
            height: 200%;
            top: -50%;
            left: -50%;
        }

        .nebula-1 {
            background: 
                radial-gradient(ellipse at 20% 30%, rgba(138, 43, 226, 0.4) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(75, 0, 130, 0.3) 0%, transparent 40%),
                radial-gradient(ellipse at 60% 70%, rgba(255, 20, 147, 0.2) 0%, transparent 45%);
            animation: nebulaMove1 60s ease-in-out infinite;
        }

        .nebula-2 {
            background: 
                radial-gradient(ellipse at 70% 60%, rgba(148, 0, 211, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 30% 80%, rgba(186, 85, 211, 0.25) 0%, transparent 45%),
                radial-gradient(ellipse at 50% 20%, rgba(255, 105, 180, 0.2) 0%, transparent 40%);
            animation: nebulaMove2 45s ease-in-out infinite;
        }

        .nebula-3 {
            background: 
                radial-gradient(ellipse at 40% 50%, rgba(128, 0, 128, 0.2) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 40%, rgba(199, 21, 133, 0.15) 0%, transparent 40%);
            animation: nebulaMove3 50s ease-in-out infinite;
        }

        @keyframes nebulaMove1 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5%, 3%) rotate(2deg); }
            50% { transform: translate(2%, -3%) rotate(-1deg); }
            75% { transform: translate(-3%, 2%) rotate(1deg); }
        }

        @keyframes nebulaMove2 {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            33% { transform: translate(-4%, 4%) rotate(-2deg); }
            66% { transform: translate(3%, -2%) rotate(1deg); }
        }

        @keyframes nebulaMove3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(2%, 2%) scale(1.05); }
        }

        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
        }

        .star.twinkle {
            animation: twinkle 3s ease-in-out infinite;
        }

        .star.moving {
            animation: starMove linear infinite;
        }

        .star.shooting {
            width: 2px !important;
            height: 2px !important;
            background: linear-gradient(90deg, white, transparent);
            border-radius: 0;
            animation: shootingStar 3s linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        @keyframes starMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 30px); }
        }

        @keyframes shootingStar {
            0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; width: 2px; }
            30% { width: 80px; opacity: 1; }
            100% { transform: translate(300px, 300px) rotate(-45deg); opacity: 0; width: 2px; }
        }

        .galaxy-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 0%, rgba(10, 0, 21, 0.4) 70%, rgba(10, 0, 21, 0.8) 100%);
            z-index: 2;
            pointer-events: none;
        }

        .main-container {
            position: relative;
            z-index: 15;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #fff;
            text-shadow: 
                0 0 10px #ff69b4,
                0 0 20px #ff69b4,
                0 0 30px #ff69b4,
                0 0 40px #9b59b6;
            margin-bottom: 10px;
            line-height: 1.3;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .title-sub {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #ffb6c1;
            text-shadow: 0 0 15px #ff69b4, 0 0 25px #9b59b6;
            margin-bottom: 20px;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff69b4, 0 0 20px #ff69b4, 0 0 30px #ff69b4; }
            to { text-shadow: 0 0 20px #ff69b4, 0 0 30px #ff69b4, 0 0 40px #ff69b4, 0 0 50px #9b59b6; }
        }

        .kuromi-container {
            position: relative;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .kuromi-body {
            position: relative;
            width: 180px;
            height: 200px;
            margin: 0 auto;
        }

        .kuromi-head {
            width: 140px;
            height: 120px;
            background: #1a1a1a;
            border-radius: 50% 50% 45% 45%;
            position: relative;
            margin: 0 auto;
            border: 3px solid #2a2a2a;
        }

        .kuromi-hood {
            position: absolute;
            width: 160px;
            height: 90px;
            background: #1a1a1a;
            border-radius: 50% 50% 0 0;
            top: -30px;
            left: -13px;
            z-index: 1;
        }

        .kuromi-ear {
            position: absolute;
            width: 35px;
            height: 70px;
            background: #1a1a1a;
            border-radius: 50% 50% 40% 40%;
            top: -60px;
            z-index: 2;
        }

        .kuromi-ear.left {
            left: 15px;
            transform: rotate(-15deg);
        }

        .kuromi-ear.right {
            right: 15px;
            transform: rotate(15deg);
        }

        .kuromi-ear-inner {
            position: absolute;
            width: 20px;
            height: 45px;
            background: #ffb6c1;
            border-radius: 50%;
            top: 10px;
            left: 7px;
        }

        .kuromi-skull {
            position: absolute;
            width: 50px;
            height: 45px;
            background: #ffb6c1;
            border-radius: 50% 50% 40% 40%;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
        }

        .kuromi-skull-eyes {
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            padding: 0 8px;
        }

        .kuromi-skull-eye {
            width: 12px;
            height: 12px;
            background: #1a1a1a;
            border-radius: 50%;
        }

        .kuromi-skull-bone {
            position: absolute;
            width: 8px;
            height: 15px;
            background: #ffb6c1;
            border-radius: 50%;
            bottom: -8px;
        }

        .kuromi-skull-bone.left { left: 5px; }
        .kuromi-skull-bone.right { right: 5px; }

        .kuromi-face {
            position: absolute;
            width: 100px;
            height: 80px;
            background: #fff;
            border-radius: 50%;
            top: 35px;
            left: 50%;
            transform: translateX(-50%);
        }

        .kuromi-eye {
            position: absolute;
            width: 20px;
            height: 25px;
            background: #1a1a1a;
            border-radius: 50%;
            top: 20px;
        }

        .kuromi-eye.left { left: 18px; }
        .kuromi-eye.right { right: 18px; }

        .kuromi-eye-shine {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
            top: 5px;
            left: 3px;
        }

        .kuromi-blush {
            position: absolute;
            width: 18px;
            height: 10px;
            background: #ffb6c1;
            border-radius: 50%;
            top: 45px;
            opacity: 0.7;
        }

        .kuromi-blush.left { left: 5px; }
        .kuromi-blush.right { right: 5px; }

        .kuromi-mouth {
            position: absolute;
            width: 15px;
            height: 8px;
            border: 3px solid #1a1a1a;
            border-top: none;
            border-radius: 0 0 50% 50%;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
        }

        .floating-emojis {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .emoji {
            position: absolute;
            font-size: 2rem;
            animation: floatEmoji 8s ease-in-out infinite;
            opacity: 0.8;
        }

        @keyframes floatEmoji {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(10deg); }
            50% { transform: translateY(-10px) rotate(-5deg); }
            75% { transform: translateY(-25px) rotate(5deg); }
        }

        .balloons-container {
            position: fixed;
            bottom: -150px;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .balloon {
            position: absolute;
            width: 60px;
            height: 75px;
            border-radius: 50% 50% 50% 50%;
            animation: riseBalloon linear infinite;
            opacity: 0.9;
        }

        .balloon::before {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-top: 12px solid inherit;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -70px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 65px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.6), rgba(255,255,255,0.2));
            border-radius: 1px;
        }

        .balloon.purple {
            background: linear-gradient(135deg, #9b59b6, #6b3fa0);
        }

        .balloon.purple::before {
            border-top-color: #6b3fa0;
        }

        .balloon.black {
            background: linear-gradient(135deg, #2c2c2c, #1a1a1a);
        }

        .balloon.black::before {
            border-top-color: #1a1a1a;
        }

        .balloon.white {
            background: linear-gradient(135deg, #fff, #e0e0e0);
        }

        .balloon.white::before {
            border-top-color: #e0e0e0;
        }

        .balloon.pink {
            background: linear-gradient(135deg, #ffb6c1, #ff69b4);
        }

        .balloon.pink::before {
            border-top-color: #ff69b4;
        }

        @keyframes riseBalloon {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateY(-150vh) rotate(20deg);
                opacity: 0;
            }
        }

        .button-container {
            margin: 30px 0;
        }

        .surprise-btn {
            background: linear-gradient(135deg, #ff69b4, #9b59b6);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 1.3rem;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 
                0 5px 20px rgba(155, 89, 182, 0.5),
                0 0 30px rgba(255, 105, 180, 0.3);
            transition: all 0.3s ease;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .surprise-btn:hover {
            transform: scale(1.08);
            box-shadow: 
                0 8px 30px rgba(155, 89, 182, 0.7),
                0 0 50px rgba(255, 105, 180, 0.5);
        }

        .surprise-btn:active {
            transform: scale(0.95);
        }

        .message-box {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff69b4;
            border-radius: 20px;
            padding: 25px 30px;
            margin: 20px auto;
            max-width: 90%;
            width: 500px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 20px rgba(255, 105, 180, 0.3),
                inset 0 0 20px rgba(155, 89, 182, 0.1);
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.4s ease;
        }

        .message-box.show {
            opacity: 1;
            transform: scale(1);
        }

        .message-text {
            color: #fff;
            font-size: 1.1rem;
            line-height: 1.6;
            text-align: center;
        }

        .decorations {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 15px 0;
            font-size: 1.8rem;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .footer {
            position: fixed;
            bottom: 10px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            z-index: 10;
        }

        @media (max-width: 600px) {
            .title {
                font-size: 2.2rem;
            }
            .title-sub {
                font-size: 2rem;
            }
            .kuromi-body {
                transform: scale(0.8);
            }
            .message-box {
                padding: 20px;
            }
            .surprise-btn {
                padding: 15px 30px;
                font-size: 1.1rem;
            }
            .decorations {
                font-size: 1.5rem;
            }
            .emoji {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="galaxy-bg">
        <div class="galaxy-layer nebula-1"></div>
        <div class="galaxy-layer nebula-2"></div>
        <div class="galaxy-layer nebula-3"></div>
    </div>
    <div class="stars-container" id="stars"></div>
    <div class="galaxy-overlay"></div>
    <div class="floating-emojis" id="emojis"></div>
    <div class="balloons-container" id="balloons"></div>

    <div class="main-container">
        <h1 class="title">&#x2728; Kuromi Te Desea Un Feliz Cumpleanos &#x2728;</h1>
        <h2 class="title-sub">&#x1F380; Nicole &#x1F380;</h2>

        <div class="decorations">
            <span>&#x1F480;</span>
            <span>&#x1F5A4;</span>
            <span>&#x1F319;</span>
            <span>&#x1F380;</span>
            <span>&#x1F31F;</span>
            <span>&#x1F987;</span>
        </div>

        <div class="kuromi-container">
            <div class="kuromi-body">
                <div class="kuromi-head">
                    <div class="kuromi-hood"></div>
                    <div class="kuromi-ear left">
                        <div class="kuromi-ear-inner"></div>
                    </div>
                    <div class="kuromi-ear right">
                        <div class="kuromi-ear-inner"></div>
                    </div>
                    <div class="kuromi-skull">
                        <div class="kuromi-skull-eyes">
                            <div class="kuromi-skull-eye"></div>
                            <div class="kuromi-skull-eye"></div>
                        </div>
                        <div class="kuromi-skull-bone left"></div>
                        <div class="kuromi-skull-bone right"></div>
                    </div>
                    <div class="kuromi-face">
                        <div class="kuromi-eye left">
                            <div class="kuromi-eye-shine"></div>
                        </div>
                        <div class="kuromi-eye right">
                            <div class="kuromi-eye-shine"></div>
                        </div>
                        <div class="kuromi-blush left"></div>
                        <div class="kuromi-blush right"></div>
                        <div class="kuromi-mouth"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="decorations">
            <span>&#x1F578;</span>
            <span>&#x1F49C;</span>
            <span>&#x1F5A4;</span>
            <span>&#x1F49C;</span>
            <span>&#x1F578;</span>
        </div>

        <div class="button-container">
            <button class="surprise-btn" id="surpriseBtn">Sorpresa</button>
        </div>

        <div class="message-box" id="messageBox">
            <p class="message-text" id="messageText">Haz clic en el boton para ver un mensaje especial</p>
        </div>
    </div>

    <div class="footer">
        Hecho con amor para Nicole
    </div>

    <script>
        var frases = [
            "Feliz cumpleaños, Nicole. Espero que lo estés disfrutando.",
            "Programar es bien difícil. Te respeto por hacerlo.",
            "No te odio ni te guardo rencor. Quiero que seas feliz.",
            "Espero que sanes esas heridas que no te dejan ser plena.",
            "Si te preguntas por qué hice esto: quería dejar un buen recuerdo de tu cumple. Espero haberlo logrado.",
            "Eres muy inteligente y capaz. Sigue así.",
            "Sé que hiciste un esfuerzo conmigo. No dejes de esforzarte en lo que sigue.",
            "No sé si eres mala persona o alguien rota. Solo sé que necesitas sanar. Y solo tú puedes ayudarte.",
            "No te juzgo, no te critico. Solo quiero alentarte a ser mejor.",
            "Quiero que Nomar y tú sean felices, el enserio me agrada.",
            "Espero que consigas tu vaca color vaca.",
            "No sé si esto es un final o una pausa. El tiempo lo dirá.",
            "No te odio. El perdón es un proceso, no una promesa inmediata.",
            "Te quiero, pero rogar, no es querer, y quiero que ambos seamos felices."
        ];

        var frasesUsadas = [];

        function showMessage() {
            var messageBox = document.getElementById("messageBox");
            var messageText = document.getElementById("messageText");
            
            if (frasesUsadas.length >= frases.length) {
                frasesUsadas = [];
            }
            
            var frasesDisponibles = [];
            for (var i = 0; i < frases.length; i++) {
                var yaUsada = false;
                for (var j = 0; j < frasesUsadas.length; j++) {
                    if (frasesUsadas[j] === i) {
                        yaUsada = true;
                        break;
                    }
                }
                if (!yaUsada) {
                    frasesDisponibles.push(i);
                }
            }
            
            var randomIndex = Math.floor(Math.random() * frasesDisponibles.length);
            var indiceSeleccionado = frasesDisponibles[randomIndex];
            
            frasesUsadas.push(indiceSeleccionado);
            
            messageBox.className = "message-box";
            setTimeout(function() {
                messageText.textContent = frases[indiceSeleccionado];
                messageBox.className = "message-box show";
            }, 200);
        }

        function createStars() {
            var container = document.getElementById("stars");
            
            for (var i = 0; i < 80; i++) {
                var star = document.createElement("div");
                star.className = "star twinkle";
                star.style.left = (Math.random() * 100) + "%";
                star.style.top = (Math.random() * 100) + "%";
                var size = (Math.random() * 2.5 + 0.5) + "px";
                star.style.width = size;
                star.style.height = size;
                star.style.animationDelay = (Math.random() * 3) + "s";
                star.style.animationDuration = (Math.random() * 2 + 2) + "s";
                container.appendChild(star);
            }
            
            for (var j = 0; j < 40; j++) {
                var movingStar = document.createElement("div");
                movingStar.className = "star moving";
                movingStar.style.left = (Math.random() * 100) + "%";
                movingStar.style.top = (Math.random() * 100) + "%";
                var moveSize = (Math.random() * 2 + 1) + "px";
                movingStar.style.width = moveSize;
                movingStar.style.height = moveSize;
                movingStar.style.opacity = (Math.random() * 0.5 + 0.3);
                movingStar.style.animationDuration = (Math.random() * 20 + 30) + "s";
                movingStar.style.animationDelay = (Math.random() * 10) + "s";
                container.appendChild(movingStar);
            }
            
            for (var k = 0; k < 5; k++) {
                createShootingStar(container, k * 8000);
            }
        }
        
        function createShootingStar(container, delay) {
            setTimeout(function() {
                var shooting = document.createElement("div");
                shooting.className = "star shooting";
                shooting.style.left = (Math.random() * 70) + "%";
                shooting.style.top = (Math.random() * 40) + "%";
                shooting.style.animationDuration = (Math.random() * 1.5 + 1.5) + "s";
                container.appendChild(shooting);
                
                setTimeout(function() {
                    if (shooting.parentNode) {
                        shooting.parentNode.removeChild(shooting);
                    }
                    createShootingStar(container, 0);
                }, 3000);
            }, delay);
        }

        function createEmojis() {
            var container = document.getElementById("emojis");
            var emojis = ["\u{1F480}", "\u{1F5A4}", "\u{1F319}", "\u{1F380}", "\u{1F31F}", "\u{1F987}", "\u{1F578}", "\u{1F49C}", "\u{2728}", "\u{1F381}", "\u{1F388}", "\u{1F382}", "\u{1F496}", "\u{2B50}", "\u{1F31F}"];
            var positions = [
                { left: "3%", top: "8%" },
                { left: "93%", top: "12%" },
                { left: "12%", top: "72%" },
                { left: "88%", top: "78%" },
                { left: "6%", top: "42%" },
                { left: "94%", top: "48%" },
                { left: "50%", top: "3%" },
                { left: "25%", top: "88%" },
                { left: "75%", top: "92%" },
                { left: "18%", top: "25%" },
                { left: "82%", top: "30%" },
                { left: "10%", top: "58%" },
                { left: "90%", top: "65%" },
                { left: "35%", top: "5%" },
                { left: "65%", top: "8%" },
                { left: "5%", top: "85%" },
                { left: "95%", top: "88%" },
                { left: "45%", top: "95%" },
                { left: "55%", top: "92%" },
                { left: "20%", top: "55%" }
            ];
            
            for (var i = 0; i < positions.length; i++) {
                var emoji = document.createElement("div");
                emoji.className = "emoji";
                emoji.textContent = emojis[i % emojis.length];
                emoji.style.left = positions[i].left;
                emoji.style.top = positions[i].top;
                emoji.style.animationDelay = (i * 0.3) + "s";
                container.appendChild(emoji);
            }
        }

        function createBalloon() {
            var container = document.getElementById("balloons");
            var colors = ["purple", "black", "white", "pink"];
            var balloon = document.createElement("div");
            
            balloon.className = "balloon " + colors[Math.floor(Math.random() * colors.length)];
            balloon.style.left = (Math.random() * 90 + 5) + "%";
            var width = Math.random() * 30 + 40;
            balloon.style.width = width + "px";
            balloon.style.height = (width * 1.2) + "px";
            balloon.style.animationDuration = (Math.random() * 5 + 8) + "s";
            
            container.appendChild(balloon);
            
            setTimeout(function() {
                if (balloon.parentNode) {
                    balloon.parentNode.removeChild(balloon);
                }
            }, 15000);
        }

        document.getElementById("surpriseBtn").onclick = showMessage;

        createStars();
        createEmojis();
        
        for (var i = 0; i < 12; i++) {
            (function(index) {
                setTimeout(function() {
                    createBalloon();
                }, index * 400);
            })(i);
        }
        
        setInterval(createBalloon, 800);
        
        setTimeout(function() {
            document.getElementById("messageBox").className = "message-box show";
        }, 500);
    </script>
</body>
</html>
